name: Build

on:
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: linux-arm64

    steps:
      - name: Download code
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test
        run: bash deploy/build.sh