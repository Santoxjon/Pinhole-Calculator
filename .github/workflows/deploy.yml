name: Deploy

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
    steps:
      - name: Download code
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

  deploy:
    needs: publish
    runs-on: [self-hosted, Linux, pinhole-deploy]
    environment: ${{ github.ref_name == 'master' && 'pro' || 'staging' }}
    permissions:
      contents: read
      packages: read
    env:
      PINHOLE_IMAGE: ${{ needs.publish.outputs.image }}
      PINHOLE_CONTAINER: ${{ github.ref_name == 'master' && 'pinhole' || 'pinhole-staging' }}
      NPM_NETWORK: ${{ vars.NPM_NETWORK }}
      PINHOLE_PORT: ${{ github.ref_name == 'master' && '6000' || '6001' }}
    steps:
      - name: Download deployment configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create temporary Docker authentication directory
        run: echo "DOCKER_CONFIG=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Deploy and check health
        run: bash deploy/deploy.sh

      - name: Remove temporary Docker credentials
        if: always()
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
